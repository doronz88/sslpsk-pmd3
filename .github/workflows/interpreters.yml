name: Interpreters

# The OpenSSL binding depends on how each interpreter ships _ssl (shared libssl, static,
# hidden symbols, DLL location), so test the distributions people actually use.
on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  conda:
    name: conda (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python: [ '3.9', '3.12' ]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python }}
          channels: conda-forge
          conda-remove-defaults: true
      - run: conda install -y -c conda-forge compilers pytest
      - run: python -m pip install .
      - name: Test
        run: |
          cd "$RUNNER_TEMP"
          python -c "import ssl, sys; print(sys.version, ssl.OPENSSL_VERSION)"
          python -m pytest -p no:cacheprovider -v -W ignore::DeprecationWarning "$GITHUB_WORKSPACE/tests"

  homebrew:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test with Homebrew python@3.12
        run: |
          brew install python@3.12
          PY="$(brew --prefix python@3.12)/bin/python3.12"
          "$PY" -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install . pytest
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -c "import ssl, sys; print(sys.version, ssl.OPENSSL_VERSION)"
          "$RUNNER_TEMP/venv/bin/python" -m pytest -p no:cacheprovider -v -W ignore::DeprecationWarning "$GITHUB_WORKSPACE/tests"

  distro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test with the distribution's python3
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q python3-venv python3-dev
          /usr/bin/python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install . pytest
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -c "import ssl, sys; print(sys.version, ssl.OPENSSL_VERSION)"
          "$RUNNER_TEMP/venv/bin/python" -m pytest -p no:cacheprovider -v -W ignore::DeprecationWarning "$GITHUB_WORKSPACE/tests"

  uv:
    name: uv python-build-standalone (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Test
        shell: bash
        run: |
          uv venv -p 3.12 --managed-python "$RUNNER_TEMP/venv"
          uv pip install -p "$RUNNER_TEMP/venv" . pytest
          PY="$RUNNER_TEMP/venv/bin/python"; [ -x "$PY" ] || PY="$RUNNER_TEMP/venv/Scripts/python.exe"
          cd "$RUNNER_TEMP"
          "$PY" -c "import ssl, sys; print(sys.version, ssl.OPENSSL_VERSION)"
          "$PY" -m pytest -p no:cacheprovider -v -W ignore::DeprecationWarning "$GITHUB_WORKSPACE/tests"
