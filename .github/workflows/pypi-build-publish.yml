name: Python build and publish

on:
  pull_request:
  release:
    types: [ published ]

jobs:
  wheels:
    name: Wheels (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64 }
          - { os: ubuntu-latest, arch: i686 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
          # one job for both architectures: macOS runners are the scarcest
          - { os: macos-latest, arch: "arm64,x86_64" }
          - { os: windows-latest, arch: AMD64 }
          - { os: windows-11-arm, arch: ARM64 }

    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm derives the version from the release tag
          fetch-depth: 0
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            python -m pytest -p no:cacheprovider -v -W ignore::DeprecationWarning {project}/tests &&
            python -W ignore::DeprecationWarning -m unittest sslpsk_pmd3.test.test_sslpsk -v
        with:
          output-dir: dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify no shared library is bundled
        shell: bash
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          bad = [(w, n) for w in glob.glob("dist/*.whl") for n in zipfile.ZipFile(w).namelist()
                 if ".libs/" in n or ".dylibs/" in n or n.lower().endswith(".dll")]
          print("\n".join(f"{w}: {n}" for w, n in bad))
          sys.exit(1 if bad else 0)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  pypi-publish:
    name: Publish release to PyPI
    if: ${{ github.event_name == 'release' }}
    needs: [ wheels, sdist ]
    runs-on: ubuntu-latest
    environment:
      name: PyPI
      url: https://pypi.org/p/sslpsk-pmd3
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
