# This workflows will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Upload python package for macOS & linux

on:
  release:
    types: [ created ]
  pull_request:

jobs:
  deploy:

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: x86_64
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: ubuntu-latest
            arch: i686

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U twine cibuildwheel==4.3.5
      - name: Build wheels
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_TEST_COMMAND: >-
            python -W ignore::DeprecationWarning {project}/.github/scripts/smoke_test.py &&
            python -W ignore::DeprecationWarning -m unittest sslpsk_pmd3.test.test_sslpsk -v
        run: cibuildwheel --output-dir dist
      - name: Verify no OpenSSL is bundled
        run: |
          python - <<'PY'
          import sys, zipfile, glob
          bad = [(w, n) for w in glob.glob("dist/*.whl") for n in zipfile.ZipFile(w).namelist()
                 if ".libs/" in n or ".dylibs/" in n]
          print("\n".join(f"{w}: {n}" for w, n in bad))
          sys.exit(1 if bad else 0)
          PY
      - name: Publish
        if: github.event_name == 'release'
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: twine upload dist/* --skip-existing
